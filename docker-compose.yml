services:
  web:
    image: nginx:1.24-alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - magento

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html:delegated
      - ./app/code/Affilify:/var/www/html/app/code/Affilify:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - db
      - redis
      - rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dashboard.affilify.it:host-gateway"
    networks:
      - magento

  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: magento
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - magento

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - magento

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - magento

volumes:
  db-data:
  rabbitmq-data:

networks:
  magento:
    driver: bridge
